<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Forms</title>
</head>

<body>

    <h1>HTML Form</h1>

    <form>

        <!-- Text Input + Label + Placeholder + Name -->

        <label for="name">Name:</label>
        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
        >

        <br><br>


        <!-- Email Input -->

        <label for="email">Email:</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
        >

        <br><br>


        <!-- Password Input -->

        <label for="password">Password:</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
        >

        <br><br>


        <!-- Radio Input -->

        <label>Gender:</label>

        <input
            type="radio"
            id="male"
            name="gender"
            value="male"
        >
        <label for="male">Male</label>

        <input
            type="radio"
            id="female"
            name="gender"
            value="female"
        >
        <label for="female">Female</label>

        <br><br>


        <!-- Checkbox Input -->

        <label>Skills:</label>

        <input
            type="checkbox"
            id="html"
            name="skills"
            value="html"
        >
        <label for="html">HTML</label>

        <input
            type="checkbox"
            id="css"
            name="skills"
            value="css"
        >
        <label for="css">CSS</label>

        <input
            type="checkbox"
            id="python"
            name="skills"
            value="python"
        >
        <label for="python">Python</label>

        <br><br>


        <!-- Select Input -->

        <label for="course">Choose a Course:</label>

        <select id="course" name="course">

            <option value="html">HTML</option>
            <option value="css">CSS</option>
            <option value="javascript">JavaScript</option>
            <option value="python">Python</option>

        </select>

        <br><br>


        <!-- Range Input -->

        <label for="experience">
            Programming Experience:
        </label>

        <input
            type="range"
            id="experience"

min="0"
            max="10"
        >

        <br><br>


        <!-- Textarea -->

        <label for="message">Message:</label>

        <br>

        <textarea
            id="message"
            name="message"
            rows="5"
            cols="30"
            placeholder="Enter your message"
        ></textarea>

        <br><br>


        <!-- Button -->

        <button type="submit">
            Submit
        </button>

        <button type="reset">
            Reset
        </button>

    </form>

</body>

</html>
